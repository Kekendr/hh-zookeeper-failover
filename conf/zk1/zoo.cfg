# Сервер 1 ансамбля из трёх, копия ZooKeeper в D:\zk\zk1
tickTime=2000
initLimit=10
syncLimit=5
# Свои у каждого сервера: папка данных, порт клиентов, порт AdminServer
dataDir=D:/zk/zk1/data
clientPort=2181
clientPortAddress=127.0.0.1
admin.serverAddress=127.0.0.1
admin.serverPort=8081
4lw.commands.whitelist=srvr,stat,ruok,mntr
# Одинаковые у всех: участники ансамбля, порт кворума и порт выборов
server.1=127.0.0.1:2888:3888
server.2=127.0.0.1:2889:3889
server.3=127.0.0.1:2890:3890
